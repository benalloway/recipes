name: opencode-address-review

# Autonomous review loop: after the opencode-review bot posts its review
# comment on an autonomous PR, an agent reads every review thread, implements
# what it agrees with, and flags disagreements for a human.
# Loop guards (see AGENTS.md "Autonomous pipeline"):
# - Only runs on PRs labeled `ai-drafted-feedback` without `ready-for-human`.
# - Ignores the action's own `[Working...]` placeholder and its own summaries.
# - Iteration budget (2 rounds) + `ready-for-human` label stop the loop.

on:
  issue_comment:
    types: [created]

jobs:
  address:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'Bot' &&
      contains(github.event.issue.labels.*.name, 'ai-drafted-feedback') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.comment.body, '[Working...]') &&
      !contains(github.event.comment.body, 'auto-address-summary')
    runs-on: ubuntu-latest
    concurrency:
      group: address-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          # NOTE: credentials must persist — the agent runs git commands itself,
          # which need auth on private repos.
          fetch-depth: 0

      - name: "Check iteration budget (hard cap: 2 address rounds per PR)"
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number }} --repo benalloway/recipes --json headRefName -q .headRefName)
          PRIOR=$(gh run list --repo benalloway/recipes --workflow opencode-address-review.yml --branch "$BRANCH" --json conclusion -q '[.[] | select(.conclusion != null)] | length')
          echo "head branch: $BRANCH, prior completed address runs: $PRIOR"
          if [ "$PRIOR" -ge 2 ]; then echo "over=true" >> "$GITHUB_OUTPUT"; else echo "over=false" >> "$GITHUB_OUTPUT"; fi

      - name: Hand to human (budget spent)
        if: steps.budget.outputs.over == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo benalloway/recipes --body "Auto-iteration budget spent (2 address rounds) — handing to human. <!-- auto-address-summary -->"
          gh pr edit ${{ github.event.issue.number }} --repo benalloway/recipes --add-label ready-for-human

      - uses: anomalyco/opencode/github@latest
        if: steps.budget.outputs.over != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          variant: max
          use_github_token: true
          prompt: |
            A review bot just posted on autonomous PR #${{ github.event.issue.number }}
            (label `ai-drafted-feedback`). Your job: read the review, implement
            what is best, flag the rest for a human. Follow AGENTS.md invariants.

            0. First, check you should act at all:
               - If the triggering comment is NOT a code review (e.g. a reply to
                 a `/oc` command, a status note), do nothing and stop silently.
               - If the PR now carries the `ready-for-human` label, stop.
               - Iteration budget is enforced by the workflow before you run; if
                 you are reading this, rounds remain.
            1. Read every unresolved review thread on the PR: all inline
               comments (`gh api repos/benalloway/recipes/pulls/<N>/comments`),
               all submitted reviews
               (`gh api repos/benalloway/recipes/pulls/<N>/reviews`), and the
               review comment bodies. Skip threads you already replied to in a
               previous round unless new information appeared.
            2. For each finding:
               - Agree → implement the fix in code.
               - Disagree → reply IN THE REVIEW THREAD (never a top-level
                 comment): `Flagging for human: <reason>`. Then add the
                 `ready-for-human` label to the PR so the loop stops and the
                 owner sees it. Keep fixing the findings you agree with.
            3. Run `npm run check` + `npm run build` green. Also read
               `gh pr checks <N>` and fix any red CI, even if unrelated to the
               review threads — a green build is required. Commit
               (`address review: <what>`) and push to the PR branch only.
               Never push to `main`. Never merge.
            4. Post ONE summary as a PR comment, including the marker
               `<!-- auto-address-summary -->` verbatim (it keeps this workflow
               from re-triggering on your own comment). List what you fixed
               (with commit sha) and what you flagged for a human, if anything.

            Never read or echo secrets.
