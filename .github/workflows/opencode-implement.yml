name: opencode-implement

# Autonomous handoff: `ready-for-agent` (spec approval) and `agent:implement`
# (execution trigger) are applied together by triage; `agent:blocked` is the
# orthogonal hold. Implement fires on `agent:implement` AND on `agent:blocked`
# removal, but a deterministic bash preflight refuses before any agent runs
# while the hold or any frontier conflict stands. That PR then flows into
# opencode-review.yml (auto review) and opencode-address-review.yml
# (auto address). See AGENTS.md "Autonomous pipeline".

on:
  issues:
    types: [labeled, unlabeled]

jobs:
  implement:
    if: |
      !github.event.issue.pull_request && (
        (github.event.action == 'labeled' && github.event.label.name == 'agent:implement') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'agent:blocked')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          # NOTE: credentials must persist — the agent runs git commands itself,
          # which need auth on private repos.
          fetch-depth: 0

      - name: Preflight blocked-gate
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATA=$(gh issue view "$ISSUE_NUMBER" --json body,labels)
          LABELS=$(echo "$DATA" | jq -r '.labels[].name')
          BODY=$(echo "$DATA" | jq -r '.body // ""')
          # Trust the triggering event over a possibly-stale label read: on an
          # `agent:blocked`-removal event, drop it even if the API still returns it.
          if [ "${{ github.event.action }}" = "unlabeled" ] && [ "${{ github.event.label.name }}" = "agent:blocked" ]; then
            LABELS=$(echo "$LABELS" | grep -vx "agent:blocked" || true)
          fi
          has() { echo "$LABELS" | grep -qx "$1"; }
          refuse() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            printf 'Preflight refusal: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            LAST=$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[-1].body // ""')
            if [ "$LAST" != "$1" ]; then gh issue comment "$ISSUE_NUMBER" --body "$1"; fi
          }

          # -1. Wayfinder planning artifacts never implement. (No labels are
          # touched here — maps/tickets must never carry execution labels.)
          if echo "$LABELS" | grep -q '^wayfinder:'; then
            refuse "Not running: this is a \`wayfinder:*\` planning issue. Decision tickets resolve via tracker comments; buildable outcomes graduate to \`needs-triage\` build tickets first."
            exit 0
          fi

          # 0. Human kill switch or external gate.
          if has ready-for-human || has blocked-external; then
            refuse "Not running: \`ready-for-human\` / \`blocked-external\` is present. Owner action required."
            exit 0
          fi

          # 0b. Active claim (cloud run or local session). Never stack runs:
          # a running implement will NOT abort (cancel-in-progress: false).
          # Checks both vocabularies during the cutover transition.
          if has agent:in-progress || has in-progress; then
            refuse "Not running: \`agent:in-progress\` is present — a run (cloud or local) already holds this issue. If it is stale, remove the label to retry."
            exit 0
          fi

          # 0c. Explicit hold (either vocabulary during transition).
          if has agent:blocked || has blocked; then
            refuse "Not running: \`agent:blocked\` / \`blocked\` is present. Remove \`agent:blocked\` once the hold clears to re-fire this check (only proceeds with \`agent:implement\` still applied)."
            exit 0
          fi

          # Unblock events need a standing trigger; a bare `agent:blocked`
          # removal on an untriggered issue must not start work.
          if [ "${{ github.event.action }}" = "unlabeled" ] && ! has agent:implement; then
            refuse "Not running: \`agent:blocked\` was removed but the issue is not \`agent:implement\`. Re-request triage first."
            exit 0
          fi

          # 1. Open `Blocked by` refs: native dependency edges first, legacy
          # body-text section as fallback (so prose mentions like "needs #13"
          # don't false-fire — only the `## Blocked by` section is parsed).
          NATIVE_REFS=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/dependencies/blocked_by" --jq '[.[] | select(.state == "OPEN") | .number] | join(" ")' 2>/dev/null || echo "")
          BODY_REFS=$(echo "$BODY" | awk '/^## Blocked by/{f=1;next}/^## /{f=0}f' | grep -o '#[0-9][0-9]*' | tr -d '#' | sort -u || true)
          OPEN_REFS=""
          for ref in $NATIVE_REFS $BODY_REFS; do
            state=$(gh issue view "$ref" --json state --jq '.state' 2>/dev/null || echo "OPEN")
            if [ "$state" = "OPEN" ]; then
              case " $OPEN_REFS " in *" $ref "*) ;; *) OPEN_REFS="$OPEN_REFS #$ref";; esac
            fi
          done
          if [ -n "$OPEN_REFS" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            refuse "Not running: still blocked by open refs:$OPEN_REFS. Applied \`agent:blocked\`; remove it (after they close) to re-fire."
            exit 0
          fi

          # 2. An open PR already closing this issue (duplicate-run guard).
          EXISTING=$(gh pr list --state open --limit 100 --json number,body --jq "[.[] | select((.body // \"\") | test(\"(?i)(closes|fixes|resolves)\\\\s+#$ISSUE_NUMBER\\\\b\")) | .number] | join(\" \")")
          if [ -n "$EXISTING" ]; then
            refuse "Not running: open PR(s) ($EXISTING) already target this issue. Close them first, or work there instead of re-labeling."
            exit 0
          fi

          # 3. Same-file overlap between the spec's `Touches` list and open PRs
          # AND in-flight (`agent:in-progress` / legacy `in-progress`) issues.
          # Fail closed: backticked tokens without spaces are paths; an empty
          # list means "no conflict data", never "no conflicts".
          TOUCHES=$(echo "$BODY" | awk '/^## Touches/{f=1;next}/^## /{f=0}f' | grep -o '`[^`]*`' | tr -d '`' | grep -v ' ' | grep -v '^$' | sort -u || true)
          if [ -z "$TOUCHES" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            refuse "Not running: no parseable \`Touches\` paths found. Add backticked repo-relative paths (no spaces) per .github/ISSUE_TEMPLATE/agent-task.md, then remove \`agent:blocked\` to retry."
            exit 0
          fi
          for pr in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            FILES=$(gh pr view "$pr" --json files --jq '.files[].path')
            HIT=$(comm -12 <(echo "$TOUCHES" | sort -u) <(echo "$FILES" | sort -u) || true)
            if [ -n "$HIT" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
              refuse "Not running: \`Touches\` overlap with open PR #$pr: $(echo "$HIT" | tr '\n' ' '). Applied \`agent:blocked\`; remove it after #$pr merges (rebase onto main first)."
              exit 0
            fi
          done
          for other in $(gh issue list --state open --limit 100 --json number,labels --jq ".[] | select(.labels[].name == \"agent:in-progress\" or .labels[].name == \"in-progress\") | select(.number != $ISSUE_NUMBER) | .number"); do
            OBODY=$(gh issue view "$other" --json body --jq '.body // ""')
            OT=$(echo "$OBODY" | awk '/^## Touches/{f=1;next}/^## /{f=0}f' | grep -o '`[^`]*`' | tr -d '`' | grep -v ' ' | grep -v '^$' | sort -u || true)
            HIT=$(comm -12 <(echo "$TOUCHES" | sort -u) <(echo "$OT" | sort -u) || true)
            if [ -n "$HIT" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
              refuse "Not running: \`Touches\` overlap with in-flight issue #$other: $(echo "$HIT" | tr '\n' ' '). Applied \`agent:blocked\`; remove it after #$other lands."
              exit 0
            fi
          done

          # Frontier clear: mark in-flight, drop any stale hold (both
          # vocabularies during transition).
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "blocked" || true
          echo "refused=false" >> "$GITHUB_OUTPUT"

      - uses: anomalyco/opencode/github@latest
        if: steps.preflight.outputs.refused != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          variant: max
          use_github_token: true
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in this repo.
            Before anything else, read AGENTS.md, docs/agents/issue-tracker.md
            (tracker rules bind every skill default), and
            .github/ISSUE_TEMPLATE/agent-task.md. Then follow AGENTS.md exactly —
            stack invariants, design system, commands, and the Workflow lifecycle
            (branch → work → verify → push → PR).
            The Workflow section's step 7 ("you NEVER merge") applies to you too.
            The bash preflight already cleared the frontier (holds, claims,
            `Blocked by` refs, duplicate PRs, file overlap); implement now, do
            not re-litigate it.

            0. Spec gate first: the issue must have a clear Goal, executable
               Tasks, and verifiable Acceptance (see
               .github/ISSUE_TEMPLATE/agent-task.md). If any are missing or
               ambiguous: do NOT implement. Post a comment listing exactly what
               is missing, replace the `agent:implement` label with
               `needs-triage`, remove `agent:in-progress` and `agent:blocked`
               if present, and stop.

            Done means ALL of these are true:
            - If a branch/PR already exists for this issue, continue it — do not
              open a duplicate. Otherwise branch from latest main:
              `feat/mN-short-desc` or `fix/short-desc`.
            - Change is scoped to the issue body. `npm run check` + `npm run build`
              are green.
            - A PR is open against `main` following .github/PULL_REQUEST_TEMPLATE.md:
              `Closes #N`, What/Why, Verification output, Human gates,
              labels `agent:review` + the issue's milestone.
            - `CHANGES.md` entry included if production behavior changes.
            - When the PR is open, remove `agent:in-progress` and
              `agent:implement` from the issue (the PR is now the in-flight
              marker; `ready-for-agent` stays as the approval record).

            If you are blocked (needs a human: secrets, dashboard/DNS action,
            ambiguous spec, or anything matching `blocked-external`): do NOT open
            a PR. Post your findings as an issue comment, add the `agent:blocked`
            label (keep `agent:implement`: trigger stands, execution waits),
            remove `agent:in-progress`, and stop.

            Never push to `main`. Never merge. Never read or echo secrets.

      - name: Report workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --add-label "agent:blocked" || true
          gh issue edit "${{ github.event.issue.number }}" --remove-label "agent:in-progress" || true
          gh issue comment "${{ github.event.issue.number }}" --body "Implement run failed before opening a PR ([logs]($RUN_URL)). Applied \`agent:blocked\` so nothing half-started fires again. Remove it (with \`agent:implement\` still applied) to retry."
