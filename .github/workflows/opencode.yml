name: opencode

# On-demand agent: mention /oc or /opencode in any issue, PR, or review comment
# and OpenCode picks it up (triage, implement, fix review threads).
# Companion to opencode-review.yml (automatic reviews on PR open/push).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          # NOTE: credentials must persist — the agent runs git commands itself,
          # which need auth on private repos. (Same lesson as opencode-review.yml.)
          fetch-depth: 1

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3-flash
          variant: max
          use_github_token: true
