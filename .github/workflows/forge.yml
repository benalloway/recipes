name: Forge

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Maximum plan -> execute -> merge cycles"
        required: false
        default: "5"
        type: string
      delivery:
        description: "How to deliver merged commits"
        required: false
        default: "pr"
        type: choice
        options:
          - push
          - pr
  issues:
    types: [labeled]

concurrency:
  group: forge-factory
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  forge:
    # Routing: the home-server runner owns `run:home` tickets — cloud skips
    # them. `run:cloud` (or neither label) runs here. workflow_dispatch has
    # no issue payload, so manual triggers always run.
    if: ${{ github.event_name != 'issues' || !contains(github.event.issue.labels.*.name, 'run:home') }}
    # Forks: replace benalloway/forge with <owner>/forge (and set FORGE_REPO for the vendor script).
    uses: benalloway/forge/.github/workflows/forge.yml@v1
    with:
      # Dispatch inputs forwarded with safe fallbacks (label events carry no
      # inputs, so `||` keeps defaults). NEVER leave `with:` comment-only —
      # GitHub rejects an empty mapping and dispatch fails with HTTP 422.
      max_iterations: ${{ inputs.max_iterations || '5' }}
      delivery: ${{ inputs.delivery || 'pr' }}
      # delivery: ${{ inputs.delivery || 'push' }}  # ONLY for repos with green CI + branch protection
      # label: Sandcastle        # uncomment while migrating from Sandcastle
      # base_branch: master      # uncomment if your trunk is not `main`
      # verify_command: "make verify"
      # setup_command: "go mod download"
    secrets:
      opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
      gh_token: ${{ secrets.FORGE_GH_TOKEN || secrets.GITHUB_TOKEN }}
      # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}  # only for direct-provider models
